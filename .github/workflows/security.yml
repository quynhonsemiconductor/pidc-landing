# =============================================================================
# Security — thin caller of the shared reusable suite (ci). Mirrors
# qnsc-landing's security.yml.
#
# pidc-landing is a static Astro site with no Dockerfile and (in this round) no
# Pages Function, so it calls the shared workflow with `scan_container: false`:
# the Trivy container-CVE job is skipped while Semgrep (SAST), Gitleaks
# (secrets) and osv-scanner (dependency CVEs) still run source-based. This
# gives the same security gate as the other public repos, so posture is
# uniform across the org.
#
# actions-security (zizmor) guards the workflow files themselves.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps
    # one. On `pull_request` the filter matches the PR's BASE branch, so a
    # filter here silently skips scans for stacked PRs.
  schedule:
    - cron: '0 4 * * 1' # weekly Monday 04:00 UTC — catch new CVEs between pushes

permissions:
  contents: read
  # Ceiling for the reusable's SARIF-upload job, which declares
  # security-events:write itself — a called workflow's job permissions can only
  # be REDUCED, not elevated, above this caller's top-level grant, and GitHub
  # validates the whole chain at startup — so this must stay even though no
  # step in THIS file uses it directly.
  security-events: write # zizmor: ignore[excessive-permissions] ceiling for reusable's SARIF job
  packages: read # ceiling for the reusable Trivy job's `packages: read`; a called
  # workflow's job permissions can only be REDUCED, not elevated, above the
  # caller's top-level grant. Trivy is skipped here (scan_container: false),
  # but GitHub validates every reusable job's permission ceiling at STARTUP
  # before evaluating `if:`, so this must be present or the whole run fails
  # with startup_failure.

jobs:
  security:
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
    with:
      product: pidc-landing
      # Gitleaks + osv-scanner + Semgrep as ONE job; the required check is
      # `security / Security scans (Gitleaks, osv-scanner, Semgrep)`.
      combine: true
      scan_container: false # no Dockerfile — skip Trivy, keep Semgrep + Gitleaks + osv
      node_version: '22'
      # ENFORCED, not report-only (same policy as qnsc-landing): a green check
      # that means "the scanner ran" rather than "the tree is clean" is worse
      # than no check.
      osv_blocking: true
    # security.yml declares no secrets -- nothing to pass (no secrets: inherit).

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
    with:
      blocking: true
      combine: true # actionlint + zizmor as ONE job; the required check is `actions-security / Workflow security (actionlint, zizmor)`
