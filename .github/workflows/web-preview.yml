# =============================================================================
# Web · Preview — every PR builds and publishes a Cloudflare Pages PREVIEW
# (pidc-landing.pages.dev/pr-preview-pr<N> via wrangler --branch). Production
# deploys stay in web-deploy.yml (main only); this workflow never touches them.
#
# Uses the same repo-level secret/vars as web-deploy.yml (owner-created,
# scoped to the PIDC account): CLOUDFLARE_API_TOKEN secret;
# CLOUDFLARE_ACCOUNT_ID + PAGES_PROJECT vars. Until those exist the publish
# step SOFT-SKIPS (green with a notice) — the build + verify:dist checks still
# run on every PR.
# =============================================================================
name: Web · Preview

on:
  pull_request:
    branches: ['**']

concurrency:
  group: preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # fork PRs get no secrets/vars; only same-repo PRs publish
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
        with:
          node-version: '22'
      - run: pnpm build
      - run: pnpm verify:dist
      - name: Publish preview (soft-skip until the owner configures the Pages project)
        id: publish
        if: vars.PAGES_PROJECT != '' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler@4.107.0 pages deploy dist \
            --project-name="${PAGES_PROJECT}" \
            --branch="pr-preview-pr${{ github.event.pull_request.number }}" \
            --commit-dirty=true
          echo "url=https://pr-preview-pr${{ github.event.pull_request.number }}.pidc-landing.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      - name: Preview URL / setup notice
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        run: |
          if [ -n "${PREVIEW_URL}" ]; then
            echo "Preview: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview NOT published: PAGES_PROJECT / CLOUDFLARE_ACCOUNT_ID repo vars are not set yet (owner step, see web-deploy.yml header). Build + verify:dist ran; publish will start once configured." >> "$GITHUB_STEP_SUMMARY"
          fi
