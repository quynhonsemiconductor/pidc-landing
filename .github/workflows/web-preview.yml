# =============================================================================
# Web · Preview — every PR builds and publishes a Cloudflare Pages PREVIEW
# (pidc-landing.pages.dev/pr-preview-pr<N> via wrangler --branch). Production
# deploys stay in web-deploy.yml (main only); this workflow never touches it.
#
# Uses the same repo-level secret/vars as web-deploy.yml (owner-created,
# scoped to the PIDC account): CLOUDFLARE_API_TOKEN secret;
# CLOUDFLARE_ACCOUNT_ID + PAGES_PROJECT vars.
# =============================================================================
name: Web · Preview

on:
  pull_request:
    branches: ['**']

concurrency:
  group: preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:dist
      - name: Fail fast if the Pages project is not configured yet
        if: vars.PAGES_PROJECT == '' || vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error ::PAGES_PROJECT / CLOUDFLARE_ACCOUNT_ID repo vars are not set yet (owner step, see web-deploy.yml header). Preview cannot publish." >&2
          exit 1
      - name: Publish preview
        run: |
          npx wrangler@4.107.0 pages deploy dist \
            --project-name="${PAGES_PROJECT}" \
            --branch="pr-preview-pr${{ github.event.pull_request.number }}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      - name: Preview URL
        run: |
          echo "Preview: https://pr-preview-pr${{ github.event.pull_request.number }}.pidc-landing.pages.dev" >> "$GITHUB_STEP_SUMMARY"
