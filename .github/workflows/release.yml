# =============================================================================
# Release Please — auto-creates a "chore(release): vX.Y.Z" PR on every
# main push, then auto-tags when that PR is merged.
#
# No deploy is gated on the release PR (the site ships continuously once a
# deploy workflow exists). This workflow exists purely for changelog + semver
# bookkeeping. Mirrors qnsc-landing's release.yml.
#
# Requires: QNSC_AUTOMATION_APP_ID (org var) + QNSC_AUTOMATION_PRIVATE_KEY (org secret).
# =============================================================================
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Delegate to the shared reusable so pinning/behaviour stays in one place
  # (quynhonsemiconductor/ci). config_file defaults to release-please-config.json.
  # Org secrets do not cross into a reusable workflow unless passed explicitly,
  # so the token goes unauthenticated without this (release PRs fell back to
  # github-actions[bot]).
  release:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
